<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#3B82F6"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="Agenda Família"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Agenda · Família Martins</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>"/>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;background:#F9FAFB;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;overscroll-behavior:none}
    .no-sb::-webkit-scrollbar{display:none}
    .no-sb{-ms-overflow-style:none;scrollbar-width:none}
    ::-webkit-scrollbar{width:3px;height:3px}
    ::-webkit-scrollbar-thumb{background:#D1D5DB;border-radius:99px}
    .fade-in{animation:fi .15s ease}
    @keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .slide-up{animation:su .3s cubic-bezier(.16,1,.3,1)}
    @keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .toast{animation:ta .2s ease}
    @keyframes ta{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    .pulse-dot{animation:pd 2s infinite}
    @keyframes pd{0%,100%{opacity:1}50%{opacity:.3}}
    input[type=date],input[type=time]{color-scheme:light}
    .active-scale:active{transform:scale(.97)}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useEffect, useCallback, useMemo } = React;

  /* ══ FIREBASE ═══════════════════════════════════════════════════════ */
  const FB = {
    apiKey:"AIzaSyC6QarZdSXDIcs4tAQZGYkQR1gcI9yAU8E",
    authDomain:"agendafamiliar-27b26.firebaseapp.com",
    projectId:"agendafamiliar-27b26",
    storageBucket:"agendafamiliar-27b26.firebasestorage.app",
    messagingSenderId:"427096201759",
    appId:"1:427096201759:web:c4f9ff05681423a856932a"
  };
  let db = null;
  try { firebase.initializeApp(FB); db = firebase.firestore(); } catch(e) {}

  /* ══ CONSTANTES ══════════════════════════════════════════════════════ */
  const CATS = [
    {id:"arthur",  label:"Arthur",       color:"#3B82F6"},
    {id:"anne",    label:"Anne",          color:"#8B5CF6"},
    {id:"joao",    label:"João Marcelo",  color:"#10B981"},
    {id:"maria",   label:"Maria Luíza",   color:"#F472B6"},
    {id:"pais",    label:"Só os Pais",    color:"#EF4444"},
    {id:"familia", label:"Família Toda",  color:"#F59E0B"},
  ];
  const DEF_TYPES = [
    {id:"festa",       label:"Festa / Aniversário", emoji:"🎂", color:"#FDE68A"},
    {id:"prova",       label:"Prova / Avaliação",    emoji:"📝", color:"#BFDBFE"},
    {id:"atividade",   label:"Atividade / Esporte",  emoji:"🥋", color:"#D1FAE5"},
    {id:"viagem",      label:"Viagem",               emoji:"✈️", color:"#E0E7FF"},
    {id:"compromisso", label:"Compromisso Geral",    emoji:"📌", color:"#F3F4F6"},
    {id:"trabalho",    label:"Trabalho",             emoji:"💼", color:"#FEE2E2"},
    {id:"jantar",      label:"Jantar / Lazer",       emoji:"🍽️", color:"#FCE7F3"},
    {id:"saude",       label:"Saúde / Médico",       emoji:"🏥", color:"#FEF3C7"},
  ];
  const DAYS   = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const MONTHS = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const MTHS   = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

  /* ══ HELPERS ═════════════════════════════════════════════════════════ */
  const toStr = d => { const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0"); return `${y}-${m}-${day}`; };
  const addD  = (d,n) => { const r=new Date(d); r.setDate(r.getDate()+n); return r; };
  const wkSt  = d => { const r=new Date(d); r.setDate(r.getDate()-r.getDay()); return r; };
  const dIM   = (y,m) => new Date(y,m+1,0).getDate();
  const fDOM  = (y,m) => new Date(y,m,1).getDay();
  const occursOn = (ev,ds) => {
    if(ev.date===ds) return true;
    if(!ev.recurrence||ev.recurrence==="none") return false;
    const ed=new Date(ev.date+"T12:00:00"), td=new Date(ds+"T12:00:00");
    if(td<ed) return false;
    if(ev.recurrence==="weekly")  return ed.getDay()===td.getDay();
    if(ev.recurrence==="monthly") return ed.getDate()===td.getDate();
    if(ev.recurrence==="annual")  return ed.getDate()===td.getDate()&&ed.getMonth()===td.getMonth();
    return false;
  };
  // evFor recebe lista pré-filtrada por categoria
  const evFor = (evs,ds) =>
    evs.filter(e=>occursOn(e,ds))
       .sort((a,b)=>a.allDay===b.allDay?(a.startTime||"").localeCompare(b.startTime||""):a.allDay?-1:1);

  /* ══ ÍCONES ══════════════════════════════════════════════════════════ */
  const Ic = ({c="",s=20,children}) => (
    <svg xmlns="http://www.w3.org/2000/svg" width={s} height={s} viewBox="0 0 24 24"
      fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c}>
      {children}
    </svg>
  );
  const ChevL  = p => <Ic {...p}><polyline points="15 18 9 12 15 6"/></Ic>;
  const ChevR  = p => <Ic {...p}><polyline points="9 18 15 12 9 6"/></Ic>;
  const PlusI  = p => <Ic {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Ic>;
  const XI     = p => <Ic {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Ic>;
  const EditI  = p => <Ic {...p}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></Ic>;
  const TrashI = p => <Ic {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></Ic>;

  /* ══ TOAST ═══════════════════════════════════════════════════════════ */
  function Toast({msg,type,onDone}) {
    useEffect(()=>{ const t=setTimeout(onDone,3000); return()=>clearTimeout(t); },[]);
    const bg = type==="ok"?"bg-green-500":type==="err"?"bg-red-500":"bg-gray-800";
    return (
      <div className={`toast fixed bottom-24 left-1/2 z-50 flex items-center gap-2 px-5 py-3 rounded-2xl text-white text-sm font-bold shadow-xl ${bg}`}>
        {type==="ok"?"✅":type==="err"?"❌":"ℹ️"} {msg}
      </div>
    );
  }

  /* ══ CONFIRM ═════════════════════════════════════════════════════════ */
  function Confirm({msg,onYes,onNo}) {
    return (
      <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4" style={{background:"rgba(0,0,0,.5)"}}>
        <div className="slide-up sm:fade-in w-full sm:max-w-xs bg-white rounded-t-3xl sm:rounded-3xl p-6 text-center">
          <p className="text-3xl mb-3">🗑️</p>
          <p className="text-sm font-bold text-gray-700 mb-6 leading-relaxed">{msg}</p>
          <div className="flex gap-3">
            <button onClick={onNo}  className="flex-1 py-4 bg-gray-100 rounded-2xl font-bold text-gray-600 text-sm active-scale">Cancelar</button>
            <button onClick={onYes} className="flex-1 py-4 bg-red-500 text-white rounded-2xl font-bold text-sm active-scale">Excluir</button>
          </div>
        </div>
      </div>
    );
  }

  /* ══ CHIP (card de evento) ═══════════════════════════════════════════ */
  function Chip({ev, types, compact, onClick}) {
    const cat  = CATS.find(c=>c.id===ev.category);
    const type = types.find(t=>t.id===ev.typeId);
    if(compact) return (
      <div onClick={e=>{e.stopPropagation();onClick(ev);}}
        className="flex items-center gap-1.5 px-2 py-1 rounded-lg cursor-pointer active-scale truncate"
        style={{backgroundColor:type?.color||"#F3F4F6"}}>
        <span className="w-1.5 h-1.5 rounded-full flex-shrink-0" style={{backgroundColor:cat?.color}}/>
        <span className="truncate text-gray-700 font-semibold leading-tight" style={{fontSize:"11px"}}>
          {!ev.allDay&&ev.startTime?`${ev.startTime} `:""}{ev.title}
        </span>
      </div>
    );
    return (
      <div onClick={()=>onClick(ev)}
        className="flex items-center gap-3 p-4 rounded-2xl cursor-pointer active-scale transition-opacity hover:opacity-90"
        style={{backgroundColor:type?.color||"#F3F4F6"}}>
        <span className="w-3 h-3 rounded-full flex-shrink-0" style={{backgroundColor:cat?.color}}/>
        <div className="flex-1 min-w-0">
          <p className="font-bold text-gray-800 leading-tight truncate">{ev.title}</p>
          <p className="text-xs text-gray-500 mt-0.5">
            {ev.allDay?"Dia todo":`${ev.startTime}–${ev.endTime}`} · {type?.emoji} {type?.label}
            {ev.recurrence&&ev.recurrence!=="none"?" 🔄":""}
          </p>
        </div>
      </div>
    );
  }

  /* ══ EVENT MODAL (full-screen mobile, card desktop) ═════════════════ */
  function EventModal({ev, types, onSave, onClose, onAddType, onToast}) {
    const isNew = !ev?.id;
    const [f,setF] = useState({
      title:ev?.title||"", category:ev?.category||"familia", typeId:ev?.typeId||"compromisso",
      date:ev?.date||toStr(new Date()), allDay:ev?.allDay!==undefined?ev.allDay:true,
      startTime:ev?.startTime||"09:00", endTime:ev?.endTime||"10:00",
      recurrence:ev?.recurrence||"none", notes:ev?.notes||"",
    });
    const [showNT,setShowNT] = useState(false);
    const [nt,setNt] = useState({label:"",emoji:"📌",color:"#E0F2FE"});
    const [saving,setSaving] = useState(false);
    const s = (k,v) => setF(p=>({...p,[k]:v}));

    // ✅ FIX: try/catch + onClose() no sucesso (sem loop de saving)
    const handleSave = async() => {
      if(!f.title.trim()||saving) return;
      setSaving(true);
      try {
        await onSave({...f, id:ev?.id||null, createdAt:ev?.createdAt||new Date().toISOString()});
        onToast(isNew?"Evento criado! ✨":"Evento atualizado!","ok");
        onClose();
      } catch(err) {
        console.error(err);
        onToast("Erro ao salvar. Verifique as regras do Firestore.","err");
        setSaving(false);
      }
    };
    const handleAddType = async() => {
      if(!nt.label.trim()) return;
      try {
        const id = await onAddType(nt);
        if(id) s("typeId",id);
        setShowNT(false); setNt({label:"",emoji:"📌",color:"#E0F2FE"});
      } catch(err) { onToast("Erro ao criar tipo.","err"); }
    };

    return (
      // Full-screen no mobile, card centralizado no desktop
      <div className="fixed inset-0 z-50 sm:flex sm:items-center sm:justify-center sm:p-4" style={{background:"transparent"}}
        onClick={e=>{ if(e.target===e.currentTarget&&!saving) onClose(); }}>
        <div className="fixed inset-0 hidden sm:block" style={{background:"rgba(0,0,0,.5)"}} onClick={()=>!saving&&onClose()}/>
        <div className="slide-up sm:fade-in fixed inset-0 sm:static sm:max-w-md sm:w-full sm:max-h-screen sm:rounded-2xl sm:shadow-2xl bg-white overflow-y-auto z-10">
          {/* Header */}
          <div className="flex items-center justify-between px-5 py-4 border-b border-gray-100 sticky top-0 bg-white z-10">
            <h2 className="text-lg font-black text-gray-800">{isNew?"Novo Evento":"Editar Evento"}</h2>
            <button onClick={onClose} disabled={saving} className="p-2 hover:bg-gray-100 rounded-full disabled:opacity-40">
              <XI s={20} c="text-gray-400"/>
            </button>
          </div>

          <div className="p-5 space-y-5 pb-8">
            {/* Título */}
            <div>
              <label className="text-xs font-black text-gray-400 uppercase tracking-wider mb-2 block">Título</label>
              <input type="text" value={f.title} onChange={e=>s("title",e.target.value)} placeholder="Nome do evento..."
                className="w-full border-2 border-gray-100 rounded-2xl px-4 py-3.5 text-base focus:outline-none focus:border-blue-400 transition font-medium"/>
            </div>

            {/* Para quem */}
            <div>
              <label className="text-xs font-black text-gray-400 uppercase tracking-wider mb-2 block">Para quem</label>
              <div className="grid grid-cols-3 gap-2">
                {CATS.map(cat=>(
                  <button key={cat.id} onClick={()=>s("category",cat.id)}
                    className="flex items-center gap-2 px-3 py-3 rounded-2xl text-xs font-bold border-2 transition-all active-scale"
                    style={{borderColor:f.category===cat.id?cat.color:"#E5E7EB",backgroundColor:f.category===cat.id?cat.color+"25":"white",color:f.category===cat.id?cat.color:"#9CA3AF"}}>
                    <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{backgroundColor:cat.color}}/>{cat.label}
                  </button>
                ))}
              </div>
            </div>

            {/* Tipo */}
            <div>
              <label className="text-xs font-black text-gray-400 uppercase tracking-wider mb-2 block">Tipo</label>
              <div className="flex flex-wrap gap-2">
                {types.map(t=>(
                  <button key={t.id} onClick={()=>s("typeId",t.id)}
                    className="flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-bold border-2 transition-all active-scale"
                    style={{backgroundColor:f.typeId===t.id?t.color:"white",borderColor:f.typeId===t.id?t.color:"#E5E7EB",color:"#374151"}}>
                    {t.emoji} {t.label}
                  </button>
                ))}
                <button onClick={()=>setShowNT(!showNT)}
                  className="flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-bold border-2 border-dashed border-gray-200 text-gray-400 hover:border-blue-400 hover:text-blue-500 transition-all active-scale">
                  <PlusI s={12}/> Novo
                </button>
              </div>
              {showNT&&(
                <div className="mt-3 p-4 bg-gray-50 rounded-2xl space-y-3">
                  <div className="flex gap-2">
                    <input value={nt.emoji} onChange={e=>setNt(t=>({...t,emoji:e.target.value}))}
                      className="w-14 border-2 border-gray-200 rounded-xl px-2 py-2.5 text-base text-center focus:outline-none" placeholder="🎯"/>
                    <input value={nt.label} onChange={e=>setNt(t=>({...t,label:e.target.value}))}
                      className="flex-1 border-2 border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none" placeholder="Nome do tipo..."/>
                    <input type="color" value={nt.color} onChange={e=>setNt(t=>({...t,color:e.target.value}))}
                      className="w-12 h-12 border-2 border-gray-200 rounded-xl cursor-pointer"/>
                  </div>
                  <button onClick={handleAddType} className="w-full py-3 bg-blue-500 text-white text-sm font-bold rounded-xl active-scale">Adicionar Tipo</button>
                </div>
              )}
            </div>

            {/* Data */}
            <div>
              <label className="text-xs font-black text-gray-400 uppercase tracking-wider mb-2 block">Data</label>
              <input type="date" value={f.date} onChange={e=>s("date",e.target.value)}
                className="w-full border-2 border-gray-100 rounded-2xl px-4 py-3.5 text-base focus:outline-none focus:border-blue-400 transition font-medium"/>
            </div>

            {/* Horário */}
            <div>
              <div className="flex items-center gap-3 mb-3">
                <label className="text-xs font-black text-gray-400 uppercase tracking-wider">Horário</label>
                <button onClick={()=>s("allDay",!f.allDay)}
                  className={`px-4 py-2 rounded-full text-xs font-black transition-all active-scale ${f.allDay?"bg-blue-100 text-blue-600":"bg-gray-100 text-gray-500"}`}>
                  {f.allDay?"☀️ Dia todo":"⏰ Com horário"}
                </button>
              </div>
              {!f.allDay&&(
                <div className="flex gap-3">
                  <div className="flex-1">
                    <label className="text-xs text-gray-400 mb-1 block">Início</label>
                    <input type="time" value={f.startTime} onChange={e=>s("startTime",e.target.value)}
                      className="w-full border-2 border-gray-100 rounded-2xl px-4 py-3 text-base focus:outline-none focus:border-blue-400"/>
                  </div>
                  <div className="flex-1">
                    <label className="text-xs text-gray-400 mb-1 block">Fim</label>
                    <input type="time" value={f.endTime} onChange={e=>s("endTime",e.target.value)}
                      className="w-full border-2 border-gray-100 rounded-2xl px-4 py-3 text-base focus:outline-none focus:border-blue-400"/>
                  </div>
                </div>
              )}
            </div>

            {/* Repetição */}
            <div>
              <label className="text-xs font-black text-gray-400 uppercase tracking-wider mb-2 block">Repetição</label>
              <div className="grid grid-cols-2 gap-2 sm:grid-cols-4">
                {[{id:"none",l:"Não repete"},{id:"weekly",l:"Semanal"},{id:"monthly",l:"Mensal"},{id:"annual",l:"Anual"}].map(r=>(
                  <button key={r.id} onClick={()=>s("recurrence",r.id)}
                    className="py-3 rounded-2xl text-xs font-bold border-2 transition-all active-scale"
                    style={{borderColor:f.recurrence===r.id?"#3B82F6":"#E5E7EB",backgroundColor:f.recurrence===r.id?"#EFF6FF":"white",color:f.recurrence===r.id?"#3B82F6":"#9CA3AF"}}>
                    {r.l}
                  </button>
                ))}
              </div>
            </div>

            {/* Observações */}
            <div>
              <label className="text-xs font-black text-gray-400 uppercase tracking-wider mb-2 block">Observações</label>
              <textarea value={f.notes} onChange={e=>s("notes",e.target.value)} placeholder="Detalhes adicionais..." rows={3}
                className="w-full border-2 border-gray-100 rounded-2xl px-4 py-3.5 text-sm focus:outline-none focus:border-blue-400 transition resize-none font-medium"/>
            </div>
          </div>

          {/* Footer */}
          <div className="sticky bottom-0 bg-white border-t border-gray-100 flex gap-3 p-4">
            <button onClick={onClose} disabled={saving}
              className="flex-1 py-4 border-2 border-gray-100 rounded-2xl text-sm font-bold text-gray-500 active-scale disabled:opacity-40">
              Cancelar
            </button>
            <button onClick={handleSave} disabled={!f.title.trim()||saving}
              className="flex-1 py-4 bg-blue-500 text-white rounded-2xl text-sm font-black active-scale disabled:opacity-40 transition-colors">
              {saving?"Salvando...":isNew?"Criar Evento":"Salvar"}
            </button>
          </div>
        </div>
      </div>
    );
  }

  /* ══ EVENT DETAIL (full-screen mobile, card desktop) ════════════════ */
  function EventDetail({ev, types, onEdit, onDelete, onClose}) {
    const cat  = CATS.find(c=>c.id===ev.category);
    const type = types.find(t=>t.id===ev.typeId);
    const d    = new Date(ev.date+"T12:00:00");
    const dl   = d.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    const rLbl = {none:"Não repete",weekly:"Repete semanalmente",monthly:"Repete mensalmente",annual:"Repete anualmente"}[ev.recurrence||"none"];
    return (
      <div className="fixed inset-0 z-50 sm:flex sm:items-center sm:justify-center sm:p-4"
        onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
        <div className="fixed inset-0 hidden sm:block" style={{background:"rgba(0,0,0,.5)"}} onClick={onClose}/>
        <div className="slide-up sm:fade-in fixed inset-0 sm:static sm:max-w-sm sm:w-full sm:rounded-2xl sm:shadow-2xl bg-white overflow-y-auto z-10 flex flex-col">
          {/* Colored header */}
          <div className="px-5 pt-12 pb-6 sm:pt-6" style={{backgroundColor:type?.color||"#F3F4F6"}}>
            <div className="flex items-start justify-between mb-4">
              <span style={{fontSize:"2.5rem"}}>{type?.emoji||"📌"}</span>
              <button onClick={onClose} className="p-2 hover:bg-black hover:bg-opacity-10 rounded-full">
                <XI s={22} c="text-gray-700"/>
              </button>
            </div>
            <h2 className="text-2xl font-black text-gray-800 leading-tight">{ev.title}</h2>
            <div className="flex items-center gap-2 mt-3">
              <span className="px-3 py-1.5 rounded-full text-xs font-black text-white" style={{backgroundColor:cat?.color}}>{cat?.label}</span>
              <span className="text-sm text-gray-600 font-semibold">{type?.label}</span>
            </div>
          </div>

          {/* Details */}
          <div className="flex-1 p-5 space-y-4">
            <div className="flex items-start gap-4">
              <span className="text-xl mt-0.5">📅</span>
              <div>
                <p className="font-bold text-gray-800 capitalize">{dl}</p>
                <p className="text-sm text-gray-400 mt-0.5">{ev.allDay?"Dia todo":`${ev.startTime} — ${ev.endTime}`}</p>
              </div>
            </div>
            {ev.recurrence&&ev.recurrence!=="none"&&(
              <div className="flex items-center gap-4"><span className="text-xl">🔄</span><p className="text-sm text-gray-600">{rLbl}</p></div>
            )}
            {ev.notes&&(
              <div className="flex items-start gap-4"><span className="text-xl mt-0.5">💬</span><p className="text-sm text-gray-600 leading-relaxed">{ev.notes}</p></div>
            )}
          </div>

          {/* Actions */}
          <div className="p-4 border-t border-gray-100 flex gap-3">
            <button onClick={()=>onDelete(ev)}
              className="flex items-center justify-center gap-2 flex-1 py-4 border-2 border-red-100 text-red-500 rounded-2xl text-sm font-bold active-scale">
              <TrashI s={18}/>Excluir
            </button>
            <button onClick={()=>onEdit(ev)}
              className="flex items-center justify-center gap-2 flex-1 py-4 bg-blue-500 text-white rounded-2xl text-sm font-black active-scale">
              <EditI s={18}/>Editar
            </button>
          </div>
        </div>
      </div>
    );
  }

  /* ══ VIEW: HOJE ═══════════════════════════════════════════════════════ */
  function TodayView({evs, types, onClick}) {
    const today = new Date();
    const ds = toStr(today);
    const dayEvs = useMemo(() => evFor(evs, ds), [evs, ds]);
    const lbl = today.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
    return (
      <div className="p-4">
        <p className="text-xs font-black text-gray-400 uppercase tracking-wider mb-4 capitalize">{lbl}</p>
        {dayEvs.length===0
          ? <div className="text-center py-20 text-gray-300"><div className="text-5xl mb-3">☀️</div><p className="text-sm font-semibold">Dia livre! Sem eventos hoje.</p></div>
          : <div className="space-y-3">{dayEvs.map(e=><Chip key={e.id+ds} ev={e} types={types} onClick={onClick}/>)}</div>}
      </div>
    );
  }

  /* ══ VIEW: SEMANA (VERTICAL!) ═════════════════════════════════════════ */
  function WeekView({cur, setCur, evs, types, onClick}) {
    const ws   = wkSt(cur);
    const days = useMemo(() => Array.from({length:7},(_,i)=>addD(ws,i)), [ws]);
    const today = toStr(new Date());

    const prev = () => { const d=new Date(cur); d.setDate(d.getDate()-7); setCur(d); };
    const next = () => { const d=new Date(cur); d.setDate(d.getDate()+7); setCur(d); };

    const weekLabel = useMemo(() => {
      const s=days[0], e=days[6];
      return s.getMonth()===e.getMonth()
        ? `${s.getDate()} – ${e.getDate()} de ${MONTHS[s.getMonth()]}`
        : `${s.getDate()} ${MTHS[s.getMonth()]} – ${e.getDate()} ${MTHS[e.getMonth()]}`;
    }, [days]);

    return (
      <div>
        {/* Navegação da semana */}
        <div className="flex items-center justify-between px-4 py-3 bg-white border-b border-gray-100">
          <button onClick={prev} className="p-2 hover:bg-gray-100 rounded-xl active-scale"><ChevL s={22} c="text-gray-500"/></button>
          <span className="text-sm font-black text-gray-700">{weekLabel}</span>
          <button onClick={next} className="p-2 hover:bg-gray-100 rounded-xl active-scale"><ChevR s={22} c="text-gray-500"/></button>
        </div>

        {/* ── VERTICAL: cada dia é um bloco empilhado ── */}
        <div className="p-4 space-y-3">
          {days.map((day,i) => {
            const ds   = toStr(day);
            const devs = useMemo(() => evFor(evs,ds), [evs,ds]);
            const iT   = ds===today;
            return (
              <div key={i} className={`rounded-2xl overflow-hidden border-2 ${iT?"border-blue-400 shadow-sm":"border-transparent"}`}>
                {/* Cabeçalho do dia */}
                <div className={`flex items-center gap-3 px-4 py-3 ${iT?"bg-blue-500":"bg-gray-100"}`}>
                  <div className={`w-9 h-9 rounded-xl flex items-center justify-center font-black text-base ${iT?"bg-white text-blue-600":"bg-white text-gray-700 shadow-sm"}`}>
                    {day.getDate()}
                  </div>
                  <div>
                    <p className={`text-xs font-black uppercase tracking-wider ${iT?"text-blue-100":"text-gray-400"}`}>{DAYS[day.getDay()]}</p>
                    <p className={`text-sm font-bold ${iT?"text-white":"text-gray-600"}`}>{MTHS[day.getMonth()]}</p>
                  </div>
                  {iT&&<span className="ml-auto bg-white text-blue-600 text-xs font-black px-2.5 py-1 rounded-full">Hoje</span>}
                  {!iT&&devs.length>0&&<span className="ml-auto bg-blue-100 text-blue-600 text-xs font-black px-2.5 py-1 rounded-full">{devs.length}</span>}
                </div>
                {/* Eventos do dia */}
                <div className="bg-white px-3 py-2 space-y-1.5 min-h-12">
                  {devs.length===0
                    ? <p className="text-xs text-gray-300 py-2 text-center">Sem eventos</p>
                    : devs.map(e=><Chip key={e.id+ds} ev={e} types={types} compact onClick={onClick}/>)}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  /* ══ VIEW: MÊS ════════════════════════════════════════════════════════ */
  function MonthView({cur, setCur, evs, types, onClick}) {
    const y=cur.getFullYear(), m=cur.getMonth();
    const cells = useMemo(() => [...Array(fDOM(y,m)).fill(null),...Array.from({length:dIM(y,m)},(_,i)=>i+1)], [y,m]);
    const today = toStr(new Date());
    const prev = () => { const d=new Date(cur); d.setMonth(d.getMonth()-1); setCur(d); };
    const next = () => { const d=new Date(cur); d.setMonth(d.getMonth()+1); setCur(d); };
    return (
      <div>
        <div className="flex items-center justify-between px-4 py-3 bg-white border-b border-gray-100">
          <button onClick={prev} className="p-2 hover:bg-gray-100 rounded-xl active-scale"><ChevL s={22} c="text-gray-500"/></button>
          <span className="text-sm font-black text-gray-700">{MONTHS[m]} {y}</span>
          <button onClick={next} className="p-2 hover:bg-gray-100 rounded-xl active-scale"><ChevR s={22} c="text-gray-500"/></button>
        </div>
        <div className="p-2">
          <div className="grid grid-cols-7 mb-1">
            {DAYS.map(d=><div key={d} className="text-center text-xs font-black text-gray-300 uppercase py-2">{d[0]}</div>)}
          </div>
          <div className="grid grid-cols-7 gap-px bg-gray-100 rounded-2xl overflow-hidden">
            {cells.map((day,i)=>{
              if(!day) return <div key={i} className="bg-gray-50 min-h-16"/>;
              const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
              const devs=evFor(evs,ds), iT=ds===today;
              return (
                <div key={i} className="bg-white min-h-16 p-1.5 cursor-pointer active-scale" onClick={()=>{ setCur(new Date(y,m,day)); }}>
                  <div className={`w-7 h-7 flex items-center justify-center rounded-full text-sm font-black mb-1 ${iT?"bg-blue-500 text-white":"text-gray-700"}`}>{day}</div>
                  <div className="space-y-0.5">
                    {devs.slice(0,2).map(e=><Chip key={e.id+ds} ev={e} types={types} compact onClick={onClick}/>)}
                    {devs.length>2&&<p className="text-gray-400 pl-1" style={{fontSize:"10px"}}>+{devs.length-2}</p>}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    );
  }

  /* ══ VIEW: ANO ════════════════════════════════════════════════════════ */
  function YearView({cur, setCur, evs, types}) {
    const y=cur.getFullYear(), today=toStr(new Date());
    const prev = () => { const d=new Date(cur); d.setFullYear(d.getFullYear()-1); setCur(d); };
    const next = () => { const d=new Date(cur); d.setFullYear(d.getFullYear()+1); setCur(d); };
    return (
      <div>
        <div className="flex items-center justify-between px-4 py-3 bg-white border-b border-gray-100">
          <button onClick={prev} className="p-2 hover:bg-gray-100 rounded-xl active-scale"><ChevL s={22} c="text-gray-500"/></button>
          <span className="text-sm font-black text-gray-700">{y}</span>
          <button onClick={next} className="p-2 hover:bg-gray-100 rounded-xl active-scale"><ChevR s={22} c="text-gray-500"/></button>
        </div>
        <div className="p-4 grid grid-cols-2 gap-3 sm:grid-cols-3">
          {Array.from({length:12},(_,m)=>{
            const nd=dIM(y,m), fd=fDOM(y,m);
            return (
              <div key={m} className="bg-gray-50 rounded-2xl p-3 cursor-pointer hover:bg-blue-50 active-scale transition-colors"
                onClick={()=>{ const d=new Date(y,m,1); setCur(d); }}>
                <p className="text-xs font-black text-gray-500 uppercase tracking-wide mb-2">{MTHS[m]}</p>
                <div className="grid grid-cols-7 gap-px">
                  {DAYS.map(d=><div key={d} className="text-center text-gray-300 text-xs font-bold">{d[0]}</div>)}
                  {Array.from({length:fd}).map((_,i)=><div key={`e${i}`}/>)}
                  {Array.from({length:nd},(_,i)=>{
                    const day=i+1;
                    const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
                    const devs=evFor(evs,ds), iT=ds===today;
                    const dots=devs.slice(0,3).map(e=>CATS.find(c=>c.id===e.category)?.color);
                    return (
                      <div key={day} className="flex flex-col items-center">
                        <span className={`text-xs w-5 h-5 flex items-center justify-center rounded-full ${iT?"bg-blue-500 text-white font-black":"text-gray-600"}`}>{day}</span>
                        {dots.length>0&&<div className="flex gap-px">{dots.map((c,di)=><span key={di} className="w-1 h-1 rounded-full" style={{backgroundColor:c}}/>)}</div>}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  /* ══ VIEW: RESUMO (Timeline vertical) ════════════════════════════════ */
  function TimelineView({evs, types, onClick}) {
    const today = toStr(new Date());

    // useMemo: ordena e filtra eventos futuros uma única vez
    const upcoming = useMemo(() =>
      evs
        .filter(e => e.date >= today)
        .sort((a,b) => a.date!==b.date ? a.date.localeCompare(b.date) : (a.startTime||"").localeCompare(b.startTime||"")),
      [evs, today]
    );

    if(upcoming.length===0) return (
      <div className="flex flex-col items-center justify-center py-24 text-gray-300 px-8">
        <div className="text-5xl mb-4">🗓️</div>
        <p className="text-sm font-bold text-center">Nenhum evento próximo.<br/>Crie um evento para começar!</p>
      </div>
    );

    let lastDs = null;
    return (
      <div className="p-4 space-y-2">
        {upcoming.map(ev => {
          const cat     = CATS.find(c=>c.id===ev.category);
          const type    = types.find(t=>t.id===ev.typeId);
          const d       = new Date(ev.date+"T12:00:00");
          const isToday = ev.date===today;
          const newDate = ev.date!==lastDs;
          lastDs = ev.date;
          return (
            <div key={ev.id}>
              {/* Separador de data */}
              {newDate&&(
                <div className="flex items-center gap-3 pt-4 pb-1 first:pt-0">
                  <div className={`w-12 text-center rounded-2xl py-1.5 flex-shrink-0 ${isToday?"bg-blue-500 text-white":"bg-gray-100 text-gray-700"}`}>
                    <p className="text-xl font-black leading-none">{d.getDate()}</p>
                    <p className="text-xs font-black uppercase leading-tight">{MTHS[d.getMonth()]}</p>
                  </div>
                  <div>
                    <p className={`text-xs font-black uppercase tracking-wider ${isToday?"text-blue-500":"text-gray-400"}`}>
                      {isToday?"— Hoje":d.toLocaleDateString("pt-BR",{weekday:"long"})}
                    </p>
                  </div>
                  <div className="flex-1 h-px bg-gray-100"/>
                </div>
              )}
              {/* Card do evento com indentação */}
              <div className="pl-16">
                <Chip ev={ev} types={types} onClick={onClick}/>
              </div>
            </div>
          );
        })}
        <div className="h-4"/>
      </div>
    );
  }

  /* ══ APP PRINCIPAL ════════════════════════════════════════════════════ */
  function App() {
    const [evs,setEvs]         = useState([]);
    const [types,setTypes]     = useState(DEF_TYPES);
    const [view,setView]       = useState("timeline");
    const [cur,setCur]         = useState(new Date());
    const [filters,setFilters] = useState(CATS.map(c=>c.id));
    const [showModal,setShowModal] = useState(false);
    const [editing,setEditing] = useState(null);
    const [detail,setDetail]   = useState(null);
    const [confirmDel,setConfirmDel] = useState(null);
    const [loading,setLoading] = useState(true);
    const [synced,setSynced]   = useState(false);
    const [toast,setToast]     = useState(null);

    const showToast = (msg,type="ok") => setToast({msg,type});

    // Firebase listeners
    useEffect(()=>{
      if(!db){ setLoading(false); return; }
      const u1=db.collection("events").onSnapshot(
        s=>{ setEvs(s.docs.map(d=>({id:d.id,...d.data()}))); setLoading(false); setSynced(true); },
        e=>{ console.error(e); setLoading(false); showToast("Erro ao conectar.","err"); }
      );
      const u2=db.collection("eventTypes").onSnapshot(
        s=>{
          if(!s.empty){ setTypes(s.docs.map(d=>({id:d.id,...d.data()}))); }
          else {
            const batch=db.batch();
            DEF_TYPES.forEach(t=>batch.set(db.collection("eventTypes").doc(t.id),{label:t.label,emoji:t.emoji,color:t.color}));
            batch.commit().catch(console.error);
          }
        },
        e=>console.error("Tipos:",e)
      );
      return ()=>{ u1(); u2(); };
    },[]);

    // ✅ useMemo: filtra eventos por categoria apenas quando evs ou filters mudam
    const filteredEvs = useMemo(()=>evs.filter(e=>filters.includes(e.category)),[evs,filters]);

    // ✅ FIX: saveEv apenas persiste — modal fecha pelo próprio EventModal
    const saveEv = useCallback(async evData=>{
      if(!db) return;
      const {id,...data}=evData;
      if(id) await db.collection("events").doc(id).update(data);
      else   await db.collection("events").add(data);
    },[]);

    const requestDel = useCallback(ev=>{ setDetail(null); setConfirmDel(ev); },[]);
    const confirmDelete = useCallback(async()=>{
      if(!db||!confirmDel) return;
      try {
        await db.collection("events").doc(confirmDel.id).delete();
        showToast("Evento excluído.","ok");
      } catch(e) { showToast("Erro ao excluir.","err"); }
      finally { setConfirmDel(null); }
    },[confirmDel]);

    const addType = useCallback(async t=>{
      if(!db) return null;
      const ref=await db.collection("eventTypes").add(t);
      return ref.id;
    },[]);

    const toggleF = id=>setFilters(p=>p.includes(id)?(p.length>1?p.filter(x=>x!==id):p):[...p,id]);
    const openNew = ()=>{ setEditing(null); setShowModal(true); };
    const closeModal = ()=>{ setShowModal(false); setEditing(null); };

    if(loading) return (
      <div className="min-h-screen flex items-center justify-center bg-gray-50">
        <div className="text-center"><div className="text-5xl mb-3 pulse-dot">📅</div><p className="text-sm font-bold text-gray-400">Conectando...</p></div>
      </div>
    );

    return (
      <div className="min-h-screen bg-gray-50">

        {/* ── HEADER FIXO ─────────────────────────────────────────── */}
        <header className="bg-white border-b border-gray-100 sticky top-0 z-30 shadow-sm">
          {/* Título */}
          <div className="flex items-center justify-between px-4 pt-4 pb-2">
            <div className="flex items-center gap-2">
              <span className="text-2xl">🏠</span>
              <div>
                <h1 className="text-base font-black text-gray-800 leading-tight">Agenda da Família</h1>
                <div className="flex items-center gap-1.5">
                  <p className="text-xs text-gray-400 font-semibold">Martins Rezende da Silva</p>
                  {synced&&<span className="w-1.5 h-1.5 rounded-full bg-green-400 pulse-dot" title="Online"/>}
                </div>
              </div>
            </div>
            <button onClick={openNew} className="hidden sm:flex items-center gap-2 px-4 py-2.5 bg-blue-500 text-white text-sm font-black rounded-2xl hover:bg-blue-600 active-scale shadow-sm">
              <PlusI s={16}/> Novo
            </button>
          </div>

          {/* Tabs de navegação */}
          <div className="flex gap-1.5 px-4 pb-3 overflow-x-auto no-sb">
            {[{id:"daily",l:"Hoje"},{id:"weekly",l:"Semana"},{id:"monthly",l:"Mês"},{id:"annual",l:"Ano"},{id:"timeline",l:"Resumo"}].map(v=>(
              <button key={v.id} onClick={()=>setView(v.id)}
                className={`px-4 py-2.5 rounded-2xl text-xs font-black whitespace-nowrap transition-all active-scale flex-shrink-0 ${view===v.id?"bg-blue-500 text-white shadow-sm":"bg-gray-100 text-gray-500"}`}>
                {v.l}
              </button>
            ))}
          </div>

          {/* Filtros por pessoa */}
          <div className="flex gap-2 px-4 pb-3 overflow-x-auto no-sb">
            {CATS.map(cat=>(
              <button key={cat.id} onClick={()=>toggleF(cat.id)}
                className="flex items-center gap-1.5 px-3 py-2 rounded-full text-xs font-black whitespace-nowrap flex-shrink-0 transition-all active-scale"
                style={{backgroundColor:filters.includes(cat.id)?cat.color+"25":"#F3F4F6",color:filters.includes(cat.id)?cat.color:"#9CA3AF",border:`2px solid ${filters.includes(cat.id)?cat.color:"transparent"}`}}>
                <span className="w-2 h-2 rounded-full" style={{backgroundColor:filters.includes(cat.id)?cat.color:"#D1D5DB"}}/>{cat.label}
              </button>
            ))}
          </div>
        </header>

        {/* ── CONTEÚDO ────────────────────────────────────────────── */}
        <main className="max-w-xl mx-auto pb-28">
          {view==="daily"    && <TodayView    evs={filteredEvs} types={types} onClick={setDetail}/>}
          {view==="weekly"   && <WeekView     evs={filteredEvs} types={types} cur={cur} setCur={setCur} onClick={setDetail}/>}
          {view==="monthly"  && <MonthView    evs={filteredEvs} types={types} cur={cur} setCur={setCur} onClick={setDetail}/>}
          {view==="annual"   && <YearView     evs={filteredEvs} types={types} cur={cur} setCur={setCur}/>}
          {view==="timeline" && <TimelineView evs={filteredEvs} types={types} onClick={setDetail}/>}
        </main>

        {/* FAB mobile */}
        <button onClick={openNew}
          className="fixed bottom-6 right-5 sm:hidden w-16 h-16 bg-blue-500 text-white rounded-2xl shadow-xl flex items-center justify-center active-scale z-20"
          style={{boxShadow:"0 8px 24px rgba(59,130,246,.5)"}}>
          <PlusI s={28}/>
        </button>

        {/* ── MODAIS ──────────────────────────────────────────────── */}
        {showModal&&<EventModal ev={editing} types={types} onSave={saveEv} onClose={closeModal} onAddType={addType} onToast={showToast}/>}
        {detail&&<EventDetail ev={detail} types={types}
          onEdit={e=>{ setDetail(null); setEditing(e); setShowModal(true); }}
          onDelete={requestDel} onClose={()=>setDetail(null)}/>}
        {confirmDel&&<Confirm msg={`Excluir "${confirmDel.title}"?`} onYes={confirmDelete} onNo={()=>setConfirmDel(null)}/>}
        {toast&&<Toast msg={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
