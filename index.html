<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <link rel="manifest" href="manifest.json">
  <title>Agenda Família Martins</title>
  <script defer src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script defer crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script defer crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script defer src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const FIREBASE_CONFIG = { apiKey: "AIzaSyC6QarZdSXDIcs4tAQZGYkQR1gcI9yAU8E", authDomain: "agendafamiliar-27b26.firebaseapp.com", projectId: "agendafamiliar-27b26", storageBucket: "agendafamiliar-27b26.firebasestorage.app", messagingSenderId: "427096201759", appId: "1:427096201759:web:c4f9ff05681423a856932a" };
    
    let db = null;
    try { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.firestore(); } catch(e) {}

    function App() {
      const [evs, setEvs] = useState([]);
      const [view, setView] = useState("timeline");
      const [detail, setDetail] = useState(null);

      useEffect(() => {
        if(!db) return;
        return db.collection("events").onSnapshot(s => {
          setEvs(s.docs.map(d=>({id:d.id, ...d.data()})));
        }, err => console.error("Firebase Auth Error:", err));
      }, []);

      const sortedEvents = useMemo(() => 
        evs.sort((a,b) => a.date.localeCompare(b.date)), [evs]
      );

      return (
        <div className="max-w-md mx-auto pb-20">
          <header className="bg-white p-4 border-b sticky top-0 z-10 shadow-sm">
            <h1 className="text-lg font-black mb-3">Agenda da Família</h1>
            <div className="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
              {['daily','weekly','monthly','annual','timeline'].map(v => (
                <button key={v} onClick={() => setView(v)} className={`px-4 py-1.5 rounded-lg text-[10px] font-bold uppercase ${view===v?'bg-blue-600 text-white':'bg-gray-100'}`}>
                  {v === 'timeline' ? 'Resumo' : v}
                </button>
              ))}
            </div>
          </header>

          <main>
            {view === "timeline" && (
              <div className="p-4 space-y-3">
                {sortedEvents.filter(e => e.date >= new Date().toISOString().split('T')[0]).map(ev => (
                  <div key={ev.id} className="bg-white p-4 rounded-xl border flex gap-4 items-center" onClick={() => setDetail(ev)}>
                    <div className="w-10 text-center font-black text-blue-600 border-r">{ev.date.split('-')[2]}</div>
                    <div>
                      <p className="font-bold text-sm">{ev.title}</p>
                      <p className="text-[10px] text-gray-400">{ev.date}</p>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>

          {detail && (
            <div className="fixed inset-0 bg-black/50 p-4 flex items-center justify-center z-50" onClick={() => setDetail(null)}>
              <div className="bg-white w-full rounded-2xl p-6" onClick={e=>e.stopPropagation()}>
                <h2 className="font-black text-lg">{detail.title}</h2>
                <p className="text-gray-500">{detail.date}</p>
                <button className="mt-6 w-full py-3 bg-red-500 text-white font-bold rounded-xl" onClick={() => {db.collection("events").doc(detail.id).delete(); setDetail(null);}}>Excluir Evento</button>
              </div>
            </div>
          )}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
