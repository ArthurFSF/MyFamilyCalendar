<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="manifest" href="manifest.json">
  <title>Agenda Família Martins</title>
  <script defer src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script defer crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script defer crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script defer src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body{background:#F9FAFB;font-family:system-ui,sans-serif}
    .no-scrollbar::-webkit-scrollbar{display:none}
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const FIREBASE_CONFIG = { apiKey: "AIzaSyC6QarZdSXDIcs4tAQZGYkQR1gcI9yAU8E", authDomain: "agendafamiliar-27b26.firebaseapp.com", projectId: "agendafamiliar-27b26", storageBucket: "agendafamiliar-27b26.firebasestorage.app", messagingSenderId: "427096201759", appId: "1:427096201759:web:c4f9ff05681423a856932a" };
    
    let db = null;
    try { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.firestore(); } catch(e) {}

    function App() {
      const [evs, setEvs] = useState([]);
      const [view, setView] = useState("timeline");
      const [detail, setDetail] = useState(null);

      useEffect(() => {
        if(!db) return;
        return db.collection("events").onSnapshot(s => setEvs(s.docs.map(d=>({id:d.id, ...d.data()}))));
      }, []);

      const getTodayStr = () => new Date().toISOString().split('T')[0];

      // Definição da Timeline (Resumo)
      const TimelineView = () => (
        <div className="p-4 space-y-3">
          {evs.filter(e => e.date >= getTodayStr()).sort((a,b) => a.date.localeCompare(b.date)).map(ev => (
            <div key={ev.id} className="p-4 bg-white rounded-xl shadow-sm border flex items-center gap-4" onClick={() => setDetail(ev)}>
              <div className="w-12 text-center border-r">
                <p className="text-[10px] uppercase font-bold text-gray-400">{(new Date(ev.date).getMonth()+1).toString().padStart(2,'0')}</p>
                <p className="font-black text-gray-800">{ev.date.split('-')[2]}</p>
              </div>
              <div className="flex-1">
                <p className="text-sm font-bold">{ev.title}</p>
                <p className="text-xs text-gray-400">{ev.date}</p>
              </div>
            </div>
          ))}
        </div>
      );

      return (
        <div className="pb-20 max-w-md mx-auto">
          <header className="bg-white sticky top-0 z-20 border-b p-4">
            <h1 className="text-xl font-black mb-4">Agenda da Família</h1>
            <div className="flex gap-2 overflow-x-auto no-scrollbar pb-2">
              {[ {id:"daily", l:"Hoje"}, {id:"weekly", l:"Semana"}, {id:"monthly", l:"Mês"}, {id:"annual", l:"Ano"}, {id:"timeline", l:"Resumo"} ].map(v => (
                <button key={v.id} onClick={() => setView(v.id)} className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap ${view===v.id ? 'bg-blue-600 text-white' : 'bg-gray-100'}`}>{v.l}</button>
              ))}
            </div>
          </header>

          <main>
            {view === "daily" && <div className="p-4 space-y-3">{evs.filter(e => e.date === getTodayStr()).map(e => <div key={e.id} className="p-4 bg-white rounded-xl border" onClick={()=>setDetail(e)}>{e.title}</div>)}</div>}
            {view === "weekly" && <div className="p-4 space-y-6">{Array.from({length:7}).map((_, i) => { const d = new Date(); d.setDate(d.getDate() + i); const ds = d.toISOString().split('T')[0]; return (<div key={i} className="border-l-4 border-blue-500 pl-4"><p className="text-xs font-bold text-gray-500 uppercase">{d.toLocaleDateString('pt-BR', {weekday:'long'})}</p>{evs.filter(e => e.date === ds).map(ev => <div key={ev.id} className="text-sm py-1" onClick={()=>setDetail(ev)}>{ev.title}</div>)}</div>);})}</div>}
            {view === "timeline" && <TimelineView />}
            {/* Adicione as outras views (monthly/annual) aqui da mesma forma */}
          </main>

          {detail && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" onClick={() => setDetail(null)}>
              <div className="bg-white w-full max-w-sm rounded-2xl p-6 fade-in" onClick={e=>e.stopPropagation()}>
                <h2 className="text-xl font-black">{detail.title}</h2>
                <p className="text-gray-500 mt-2">{detail.date}</p>
                <button className="w-full mt-6 py-3 bg-red-500 text-white rounded-xl font-bold" onClick={() => {db.collection("events").doc(detail.id).delete(); setDetail(null);}}>Excluir Evento</button>
              </div>
            </div>
          )}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
