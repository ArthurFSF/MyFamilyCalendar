<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <link rel="manifest" href="manifest.json">
  <title>Agenda Família Martins</title>
  <script defer src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script defer crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script defer crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script defer src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body{background:#F9FAFB;font-family:system-ui,sans-serif}
    .no-scrollbar::-webkit-scrollbar{display:none}
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const FIREBASE_CONFIG = { apiKey: "AIzaSyC6QarZdSXDIcs4tAQZGYkQR1gcI9yAU8E", authDomain: "agendafamiliar-27b26.firebaseapp.com", projectId: "agendafamiliar-27b26", storageBucket: "agendafamiliar-27b26.firebasestorage.app", messagingSenderId: "427096201759", appId: "1:427096201759:web:c4f9ff05681423a856932a" };
    
    let db = null;
    try { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.firestore(); } catch(e) {}

    function App() {
      const [evs, setEvs] = useState([]);
      const [view, setView] = useState("timeline");
      const [detail, setDetail] = useState(null);

      useEffect(() => {
        if(!db) return;
        return db.collection("events").onSnapshot(s => setEvs(s.docs.map(d=>({id:d.id, ...d.data()}))));
      }, []);

      const getTodayStr = () => new Date().toISOString().split('T')[0];

      return (
        <div className="pb-20 max-w-md mx-auto">
          <header className="bg-white sticky top-0 z-20 border-b p-4">
            <h1 className="text-xl font-black mb-4">Agenda da Família</h1>
            <div className="flex gap-2 overflow-x-auto no-scrollbar pb-2">
              {[ {id:"daily", l:"Hoje"}, {id:"weekly", l:"Semana"}, {id:"monthly", l:"Mês"}, {id:"annual", l:"Ano"}, {id:"timeline", l:"Resumo"} ].map(v => (
                <button key={v.id} onClick={() => setView(v.id)} className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap ${view===v.id ? 'bg-blue-600 text-white' : 'bg-gray-100'}`}>{v.l}</button>
              ))}
            </div>
          </header>

          <main>
            {/* VIEW: HOJE (VERTICAL) */}
            {view === "daily" && (
              <div className="p-4 space-y-3">
                {evs.filter(e => e.date === getTodayStr()).map(ev => (
                  <div key={ev.id} className="p-4 bg-white rounded-xl shadow-sm border" onClick={()=>setDetail(ev)}>{ev.title}</div>
                ))}
              </div>
            )}

            {/* VIEW: SEMANA (VERTICAL) */}
            {view === "weekly" && (
              <div className="p-4 space-y-6">
                {Array.from({length:7}).map((_, i) => {
                  const d = new Date(); d.setDate(d.getDate() + i);
                  const ds = d.toISOString().split('T')[0];
                  return (
                    <div key={i} className="border-l-4 border-blue-500 pl-4">
                      <p className="text-xs font-bold text-gray-500 uppercase">{d.toLocaleDateString('pt-BR', {weekday:'long'})}</p>
                      {evs.filter(e => e.date === ds).map(ev => <div key={ev.id} className="text-sm py-1" onClick={()=>setDetail(ev)}>{ev.title}</div>)}
                    </div>
                  );
                })}
              </div>
            )}

            {/* VIEW: RESUMO (TIMELINE VERTICAL) */}
            {view === "timeline" && (
              <div className="p-4 space-y-3">
                {evs.filter(e => e.date >= getTodayStr()).sort((a,b) => a.date.localeCompare(b.date)).map(ev => (
                  <div key={ev.id} className="bg-white p-4 rounded-xl border flex gap-4" onClick={() => setDetail(ev)}>
                    <div className="text-center w-12 font-black text-blue-600">{ev.date.split('-')[2]}</div>
                    <div><p className="font-bold text-sm">{ev.title}</p><p className="text-xs text-gray-400">{ev.date}</p></div>
                  </div>
                ))}
              </div>
            )}
          </main>

          {detail && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-0 sm:p-4" onClick={() => setDetail(null)}>
              <div className="bg-white w-full h-full sm:h-auto sm:max-w-sm sm:rounded-3xl p-8 flex flex-col justify-center" onClick={e=>e.stopPropagation()}>
                <h2 className="text-2xl font-black">{detail.title}</h2>
                <p className="text-gray-500 mt-2 text-lg">{detail.date}</p>
                <button className="w-full mt-10 py-4 bg-red-500 text-white rounded-2xl font-bold text-lg" onClick={() => {db.collection("events").doc(detail.id).delete(); setDetail(null);}}>Excluir Evento</button>
                <button className="w-full mt-4 py-4 bg-gray-100 rounded-2xl font-bold text-lg" onClick={() => setDetail(null)}>Voltar</button>
              </div>
            </div>
          )}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
